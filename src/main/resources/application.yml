spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gestiondestock?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

## Specify DBMS
  jpa:
    database: POSTGRESQL
    show-sql: false

# Hibernate ddl auto (create, create-drop, validate, update)
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect

server:
  port: 8081